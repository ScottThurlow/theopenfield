name: Deploy PPE (opus)

# On push to `ppe`, the self-hosted runner on opus (label `opus`, running as the
# `deploy` user) mirrors the branch into the nginx docroot. The shared staging
# nginx (infra: opus:/opt/www) serves it live from the bind mount — no restart.
#
# Note: worker/ is a Cloudflare Worker and is excluded — it is not deployed by
# this job and its endpoint does not exist on the PPE host.

on:
  push:
    branches: [ppe]
  workflow_dispatch:

concurrency:
  group: ppe-opus-theopenfield
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, opus]
    steps:
      - name: Checkout ppe
        uses: actions/checkout@v4

      - name: Sync ppe -> /var/www/ppe.theopenfield.org/html
        run: |
          set -euo pipefail
          DEST=/var/www/ppe.theopenfield.org/html
          mkdir -p "$DEST"
          # Mirror the site; drop repo plumbing and the Cloudflare Worker source.
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='.gitignore' \
            --exclude='.DS_Store' --exclude='worker' \
            --exclude='README.md' --exclude='LICENSE' \
            ./ "$DEST/"
          echo "Deployed $GITHUB_SHA -> $DEST"
